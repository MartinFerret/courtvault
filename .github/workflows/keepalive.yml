name: Supabase keep-alive

# Supabase Free pauses a project after 7 days without API or database activity.
# The daily cron jobs already count as activity; this is the belt-and-braces fallback.
# Requires repository secrets SUPABASE_URL and SUPABASE_ANON_KEY.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_KEEPALIVE != 'off' }}
    steps:
      - name: Query plan_limits through the REST API
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then echo "SUPABASE_URL not set, skipping"; exit 0; fi
          curl --fail --silent --show-error \
            "${{ secrets.SUPABASE_URL }}/rest/v1/plan_limits?select=key&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
