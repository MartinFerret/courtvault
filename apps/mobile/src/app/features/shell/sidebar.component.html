<nav class="cv-sidebar" aria-label="Main">
  <a routerLink="/tabs/last-night" class="cv-sidebar__brand">{{ brand }}</a>

  <ion-button expand="block" routerLink="/tabs/scan" class="cv-sidebar__add">
    <ion-icon slot="start" name="add-outline" aria-hidden="true"></ion-icon>
    Add a card
  </ion-button>

  <ul class="cv-sidebar__links">
    @for (link of links; track link.path) {
      <li>
        <a [routerLink]="link.path" routerLinkActive="is-active" ariaCurrentWhenActive="page">
          <ion-icon [name]="link.icon" aria-hidden="true"></ion-icon>
          <span>{{ link.label }}</span>
        </a>
      </li>
    }
  </ul>

  <div class="cv-sidebar__foot">
    @if (plan.isPremium()) {
      <p class="cv-sidebar__plan cv-sidebar__plan--premium">Premium</p>
    } @else {
      <button type="button" class="cv-sidebar__plan" (click)="openPaywall()">
        Free plan · Go Premium
      </button>
    }
    <button type="button" class="cv-sidebar__help" (click)="shortcuts.showHelp()">
      Keyboard shortcuts <kbd>?</kbd>
    </button>
  </div>
</nav>
