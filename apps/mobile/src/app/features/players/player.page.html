<ion-header class="cv-header">
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button defaultHref="/tabs/last-night" aria-label="Back"></ion-back-button></ion-buttons>
    <ion-title>Player</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  @if (player(); as p) {
    <div class="cv-page-head">
      <div>
        <p class="cv-page-head__eyebrow">{{ p.team ?? 'Team to be announced' }}</p>
        <h1>{{ p.name }}</h1>
      </div>
      <div class="cv-page-head__actions">
        <ion-button class="cv-tile-btn" [class.cv-tile-btn--lime]="follows.playerIds().has(p.id)" (click)="toggleFollow()" [attr.aria-pressed]="follows.playerIds().has(p.id)" aria-label="Follow player">
          <ion-icon slot="icon-only" [name]="follows.playerIds().has(p.id) ? 'heart' : 'heart-outline'"></ion-icon>
        </ion-button>
      </div>
    </div>
    <h2 style="margin-bottom: 12px">Cards</h2>
    <ion-list>
      @for (c of p.cards; track c.id) {
        <ion-item [routerLink]="['/cards', c.slug]" [detail]="true">
          <ion-label>
            <h2>#{{ c.number }} {{ c.card_sets?.season }} {{ c.card_sets?.name }} @if (c.is_rookie) { <span class="cv-badge">RC</span> }</h2>
          </ion-label>
        </ion-item>
      }
    </ion-list>
  }
</ion-content>
