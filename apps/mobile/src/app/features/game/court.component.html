<div
  class="cv-court"
  [class.cv-court--locked]="locked()"
  role="group"
  [attr.aria-label]="'Your lineup, ' + filled() + ' of 5 players'"
>
  <svg class="cv-court__lines" viewBox="0 0 500 470" preserveAspectRatio="none" aria-hidden="true">
    <g fill="none" stroke="var(--cv-court-line)" stroke-width="3.2">
      <!-- The paint, tinted like a stained key -->
      <rect x="170" y="0" width="160" height="190" fill="rgba(18, 20, 23, 0.16)" />
      <!-- Free-throw circle: solid half outside the key, dashed half inside -->
      <path d="M190 190 A60 60 0 0 0 310 190" />
      <path d="M190 190 A60 60 0 0 1 310 190" stroke-dasharray="10 9" />
      <!-- Restricted area, rim and backboard -->
      <path d="M210 52 A40 40 0 0 0 290 52" />
      <line x1="220" y1="40" x2="280" y2="40" stroke-width="4" />
      <circle cx="250" cy="52" r="9" stroke-width="3" />
      <!-- Three-point line -->
      <path d="M30 0 V140 A237.5 237.5 0 0 0 470 140 V0" />
      <!-- Half-court line and center circle -->
      <line x1="0" y1="468" x2="500" y2="468" />
      <path d="M190 470 A60 60 0 0 1 310 470" />
      <!-- Our own mark at center court: the brand ball, never a league or team logo -->
      <circle cx="250" cy="470" r="22" stroke-width="2.4" opacity="0.6" />
      <!-- Baseline and sidelines -->
      <rect x="1.6" y="1.6" width="496.8" height="470" />
    </g>
  </svg>

  @if (locked()) {
    <span class="cv-court__lock"
      ><ion-icon name="lock-closed" aria-hidden="true"></ion-icon>{{ lockLabel() }}</span
    >
  }

  <div class="cv-court__spots">
    @for (spot of spots; track $index; let i = $index) {
      @let p = slots()[i];
      <button
        type="button"
        class="cv-spot"
        [class.cv-spot--empty]="!p"
        [class.cv-spot--selected]="selected() === i"
        [class.cv-spot--drop]="dropTarget() === i"
        [class.cv-spot--seated]="seated() === i"
        [style.left.%]="spot.x"
        [style.top.%]="spot.y"
        [disabled]="locked()"
        [attr.aria-label]="spotLabel(i)"
        [attr.aria-pressed]="selected() === i"
        (click)="spotTap.emit(i)"
        (dragover)="onDragOver($event, i)"
        (dragleave)="dropTarget.set(null)"
        (drop)="onDrop($event, i)"
      >
        @if (p) {
          <span
            class="cv-mini-card"
            [class]="
              'cv-mini-card ' + (p.card?.parallel ?? 'Base' | foilClass: p.card?.serial_run ?? null)
            "
            [style.--foil-hue]="p.card?.parallel ?? 'Base' | foilHue: p.card?.serial_run ?? null"
            [style.--foil-sat]="p.card?.parallel ?? 'Base' | foilSat: p.card?.serial_run ?? null"
          >
            @if (p.card) {
              <span class="cv-mini-card__set" aria-hidden="true"
                >{{ shortSet(p.card.set) }} #{{ p.card.number }}</span
              >
            }
            <span class="cv-mini-card__initials" aria-hidden="true">{{ initials(p.name) }}</span>
            <span class="cv-mini-card__name">{{ lastName(p.name) }}</span>
            <span class="cv-mini-card__meta">
              @if (p.avg_fpts !== null) {
                <span class="cv-mini-card__fpts">{{ p.avg_fpts }}</span> avg
              } @else {
                No games yet
              }
            </span>
          </span>
          @if (p.player_id === captainId()) {
            <span class="cv-armband" aria-hidden="true">C</span>
          }
        } @else {
          <ion-icon name="add" aria-hidden="true"></ion-icon>
          <span>Add player</span>
        }
      </button>
    }
  </div>
</div>
